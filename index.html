<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Photography portfolio — landscape and nature." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- WebGL canvas for exhibition mode -->
    <canvas id="gl-canvas" aria-hidden="true"></canvas>

    <!-- Fallback for no-WebGL / screen readers -->
    <div id="fallback-img" aria-live="polite"></div>

    <!-- Exhibition UI overlay -->
    <div id="exhibition-ui" role="main" aria-label="Photography exhibition">
      <div id="photo-num" class="photo-num" aria-live="polite" aria-atomic="true">01</div>
      <nav class="exhibition-nav" aria-label="Exhibition navigation">
        <button id="btn-prev" class="btn-nav" aria-label="Previous photograph">&#8592;</button>
        <button id="btn-next" class="btn-nav" aria-label="Next photograph">&#8594;</button>
      </nav>
      <button id="btn-index" class="btn-index" aria-label="Open photo index">Index</button>
    </div>

    <!-- Index / grid view -->
    <div id="index-view" class="hidden" role="dialog" aria-label="Photo index" aria-modal="true">
      <div class="index-header">
        <button id="btn-exhibition" class="btn-exhibition" aria-label="Return to exhibition">Exhibition</button>
      </div>
      <div id="index-grid" class="index-grid" role="list"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
