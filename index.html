<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Portfolio</title>
  <link rel="manifest" href="/portfolio/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Portfolio" />
  <link rel="apple-touch-icon" href="/portfolio/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="stage">
    <img id="img-a" class="photo" alt="" />
    <img id="img-b" class="photo" alt="" />
  </div>

  <div id="ui">
    <button id="btn-index" aria-label="Open index">Index</button>
    <span id="num" aria-live="polite">01</span>
  </div>

  <nav id="arrows" aria-label="Navigate photos">
    <button id="btn-prev" aria-label="Previous">&#8592;</button>
    <button id="btn-next" aria-label="Next">&#8594;</button>
  </nav>

  <div id="index-panel" class="hidden" role="dialog" aria-label="All photographs" aria-modal="true">
    <div id="index-header">
      <button id="btn-close" aria-label="Return to slideshow">&#10005;</button>
    </div>
    <div id="index-grid" role="list"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
